org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# We define jvmAndroidMain's dependsOn edges by hand (build.gradle.kts) in
# anticipation of a future androidTarget() sharing it alongside jvm() — see the
# comment there. That's an explicit alternative to the default hierarchy
# template, not an oversight.
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.useAndroidX=true
