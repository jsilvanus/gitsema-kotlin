[versions]
kotlin = "2.0.21"
coroutines = "1.9.0"
jgit = "6.10.0.202406032230-r"
kotlinx-datetime = "0.6.1"
# 8.5.x, not something newer: Kotlin 2.0.21's Gradle plugin tests against AGP
# 8.5 at the top end and warns on every build above it ("higher than the
# maximum known to the Kotlin Gradle Plugin"). Bump this together with Kotlin,
# not ahead of it.
android-gradle-plugin = "8.5.2"
android-compileSdk = "34"
android-minSdk = "26"
junit = "4.13.2"
# Pinned to what sqldelight 2.0.2's android-driver is built against; the
# FrameworkSQLiteDatabase(SQLiteDatabase) constructor SqlDriverFactory.android.kt
# uses is public API in this line.
androidx-sqlite = "2.3.1"
sqldelight = "2.0.2"
# Pinned to the 1.7.x line, which targets Kotlin 2.0.x — the serialization
# compiler plugin ships with Kotlin, so this must track the kotlin version.
serialization = "1.7.3"
# Matches the slf4j-api line JGit 6.10 depends on. Present only to give SLF4J
# a binding so JGit stops printing its "Failed to load StaticLoggerBinder"
# banner on every CLI invocation.
slf4j = "1.7.36"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-jvm-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
