name: Publish to GitHub Packages

# Manual only, by design -- this library is still Tier 1, not something to
# auto-publish on every push. Run from the Actions tab when there's an
# actual reason to cut a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (e.g. 0.2.0 or 0.2.0-alpha). Leave blank to
          publish the version currently set in gitsema-core/build.gradle.kts.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            ./gradlew publish -Pversion="${{ inputs.version }}" --no-daemon
          else
            ./gradlew publish --no-daemon
          fi
