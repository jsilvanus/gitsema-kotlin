name: Publish to GitHub Packages

# Every push to main publishes a build version, 0.1.0-build.<run>+<sha8>. Versions are immutable
# (GitHub Packages refuses to overwrite one, and run numbers never repeat), so consumers pin an exact
# version. workflow_dispatch can publish an explicit version by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (e.g. 0.2.0 or 0.2.0-alpha). Leave blank to
          publish a build version for the selected commit.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.1.0-build.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:8}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -Pversion="$VERSION" --no-daemon

      - name: Record version
        run: echo "Published $VERSION" >> "$GITHUB_STEP_SUMMARY"
